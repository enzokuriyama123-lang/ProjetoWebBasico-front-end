    <main class="container conteudo my-4">
      <h1>Meus animais favoritos</h1>
      <form id="formFav" class="formulario mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-6">
            <label for="animal" class="form-label">Animal</label>
            <input
              type="text"
              id="animal"
              class="form-control"
              placeholder="Ex.: Leão"
              required
              minlength="3"
              pattern="[A-Za-zÀ-ÿ\- ]{3,}"
              title="Use apenas letras, espaços e hífen (mínimo de 3 caracteres)"
            />
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Seu e-mail</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="voce@exemplo.com"
              required
            />
          </div>
          <div class="col-12">
            <label for="motivo" class="form-label">Por que é seu favorito?</label>
            <textarea
              id="motivo"
              class="form-control"
              rows="3"
              placeholder="Escreva em pelo menos 10 caracteres"
              required
              minlength="10"
            ></textarea>
          </div>
          <div class="col-6 col-md-6">
            <label for="nota" class="form-label">Nota</label>
            <select id="nota" class="form-select">
              <option value="5">5 ★</option>
              <option value="4">4 ★</option>
              <option value="3">3 ★</option>
              <option value="2">2 ★</option>
              <option value="1">1 ★</option>
            </select>
          </div>
          <div class="col-6 col-md-6">
            <button type="submit" class="btn btn-success w-100">
              Adicionar
            </button>
          </div>
        </div>
      </form>
      <p id="resumo" class="lead"></p>
      <div class="table-responsive">
        <table class="table table-striped table-hover tabela-dados align-middle">
          <thead>
            <tr>
              <th>Animal</th>
              <th>E-mail</th>
              <th>Motivo</th>
              <th>Nota</th>
              <th class="text-end">Ação</th>
            </tr>
          </thead>
          <tbody id="tabFav"></tbody>
        </table>
      </div>
